# yamllint disable-line rule:document-start
name: release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release
        run: composer run-script release:build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gf-sagepay
          path: release/*.zip

  lint-wp-org:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gf-sagepay
      - run: unzip gf-sagepay.zip -d /tmp/plugin-source-code
      - run: find /tmp/plugin-source-code -name "*.php" -print0 | xargs -n 1 -0 php -l

  publish-to-github-releases:
    runs-on: ubuntu-latest
    needs: lint-wp-org
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gf-sagepay
      - name: Create release
        run: gh release create "${GITHUB_REF_NAME}" gf-sagepay.zip --repo "${GITHUB_REPOSITORY}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
